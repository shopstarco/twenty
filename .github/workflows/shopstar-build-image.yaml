name: shopstar - build image

on:
  push:
    branches:
      - upgrade/twenty-upstream-20261022
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish under ghcr.io/shopstarco/twenty
        required: true
        default: v2.51.0-starts-expanded
      app_version:
        description: APP_VERSION baked into the image
        required: true
        default: 2.51.0

env:
  IMAGE: ghcr.io/shopstarco/twenty
  DEFAULT_IMAGE_TAG: v2.51.0-starts-expanded
  DEFAULT_APP_VERSION: 2.51.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ inputs.app_version || env.DEFAULT_APP_VERSION }}
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag || env.DEFAULT_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
